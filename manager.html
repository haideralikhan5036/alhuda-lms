<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Unified Operations Portal — Al-Huda LMS</title>
  <meta http-equiv="refresh" content="0; url=index.html?role=manager">
  <script>
    (function() {
      var currentSearch = window.location.search;
      var params = new URLSearchParams(currentSearch);
      if (!params.has('role')) {
        params.set('role', 'manager');
      }
      var queryString = '?' + params.toString();
      var targetUrl = 'index.html' + queryString + window.location.hash;
      window.location.replace(targetUrl);
    })();
  </script>
</head>
<body style="margin: 0; padding: 0; background: #053344; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; color: #ffffff;">
  <div style="text-align: center; padding: 24px; max-width: 480px;">
    <div style="width: 48px; height: 48px; border: 4px solid #C5A880; border-top-color: transparent; border-radius: 50%; margin: 0 auto 18px auto; animation: spin 0.9s linear infinite;"></div>
    <h2 style="font-size: 19px; font-weight: 700; margin: 0 0 8px 0; color: #f8fafc;">Opening Unified Operations Cockpit...</h2>
    <p style="font-size: 13px; color: #94a3b8; margin: 0 0 16px 0;">Manager Mode &bull; Protected Contacts &amp; Deletion Guard Active</p>
    <a href="index.html?role=manager" style="display: inline-block; font-size: 12px; color: #C5A880; text-decoration: underline; font-weight: 600;">Click here if not redirected automatically</a>
  </div>
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
