<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reader Self-Test — Al-Huda LMS</title>
<style>
  body { font-family: system-ui, sans-serif; background:#faf6ee; color:#1c1917; margin:0; padding:16px; }
  .card { max-width:640px; margin:0 auto; background:#fff; border:1px solid #e7e0cf; border-radius:16px; padding:20px; box-shadow:0 10px 30px rgba(74,60,35,.12); }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:#78716c; font-size:13px; margin:0 0 16px; }
  .step { border-top:1px solid #f0ead9; padding:12px 0; font-size:15px; }
  .step b { display:block; margin-bottom:2px; }
  .ok { color:#047857; font-weight:700; }
  .bad { color:#be123c; font-weight:700; }
  .wait { color:#a8a29e; }
  .mono { font-family: ui-monospace, monospace; font-size:12px; word-break:break-all; color:#57534e; }
  img.pv { max-width:100%; border:1px solid #e7e0cf; border-radius:8px; margin-top:8px; display:none; }
  button { background:#047857; color:#fff; border:0; border-radius:999px; padding:10px 18px; font-size:15px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<div class="card">
  <h1>Reader Self-Test</h1>
  <p class="sub">Ye page reader ke bilkul wohi steps aap ke browser mein chala kar har step ka result likhta hai. Koi password ya token screen par nahi aata.</p>
  <button id="runBtn" type="button">Run test</button>
  <div id="steps"></div>
</div>
<script>
(function () {
  var WORKER = 'https://alhuda-lms.ceoislamiccentre.workers.dev';
  var stepsEl = document.getElementById('steps');
  function addStep(title) {
    var d = document.createElement('div');
    d.className = 'step';
    d.innerHTML = '<b></b><span class="wait">checking...</span><div class="mono"></div><img class="pv" alt="">';
    d.querySelector('b').textContent = title;
    stepsEl.appendChild(d);
    return {
      el: d,
      ok: function (msg, detail) { this.set('ok', msg, detail); },
      bad: function (msg, detail) { this.set('bad', msg, detail); },
      set: function (cls, msg, detail) {
        var s = d.querySelector('span');
        s.className = cls;
        s.textContent = msg;
        if (detail) d.querySelector('.mono').textContent = detail;
      }
    };
  }
  function findToken() {
    var keys = ['alhuda_owner_token', 'alhuda_manager_token', 'alhuda_teacher_token', 'alhuda_parent_token'];
    for (var i = 0; i < keys.length; i++) {
      try {
        var t = sessionStorage.getItem(keys[i]);
        if (t) return { role: keys[i].replace('alhuda_', '').replace('_token', ''), token: t };
      } catch (e) { return { error: 'sessionStorage blocked: ' + e.message }; }
    }
    return null;
  }
  function getBooks() {
    try { return JSON.parse(localStorage.getItem('alhuda_custom_books') || '[]'); } catch (e) { return []; }
  }
  function findPage(matchTitle, pageIdx) {
    var books = getBooks();
    for (var i = 0; i < books.length; i++) {
      var b = books[i];
      if (b && Array.isArray(b.pages) && String(b.title || '').toLowerCase().indexOf(matchTitle) !== -1) {
        if (b.pages[pageIdx]) return { title: b.title, page: pageIdx + 1, url: b.pages[pageIdx] };
      }
    }
    return null;
  }
  function firstPage() {
    var books = getBooks();
    for (var i = 0; i < books.length; i++) {
      var b = books[i];
      if (b && Array.isArray(b.pages)) {
        for (var j = 0; j < b.pages.length; j++) if (b.pages[j]) return { title: b.title || b.id, page: j + 1, url: b.pages[j] };
      }
    }
    return null;
  }
  function imgDisplayTest(step, blob) {
    return new Promise(function (resolve) {
      var img = step.el.querySelector('img.pv');
      var url = URL.createObjectURL(blob);
      var done = false;
      var to = setTimeout(function () { if (!done) { done = true; resolve('timeout — 10s mein tasveer nahi khuli'); } }, 10000);
      img.onload = function () { if (!done) { done = true; clearTimeout(to); img.style.display = 'block'; resolve('ok ' + img.naturalWidth + 'x' + img.naturalHeight); } };
      img.onerror = function () { if (!done) { done = true; clearTimeout(to); resolve('img error — file aayi lekin tasveer NAHI bani'); } };
      img.src = url;
    });
  }
  async function fullReaderFlow(step, pick, token) {
    if (!pick) { step.bad('Ye book is browser ke saved data mein nahi mili'); return; }
    var r;
    try {
      r = await fetch(pick.url, { headers: { 'Authorization': 'Bearer ' + token } });
    } catch (e) { step.bad('Fetch FAIL', e.name + ': ' + e.message); return; }
    if (!r.ok) { step.bad('Server ne mana kiya: HTTP ' + r.status, pick.url); return; }
    var blob;
    try { blob = await r.blob(); } catch (e) { step.bad('File parhne mein fail', e.name + ': ' + e.message); return; }
    var res = await imgDisplayTest(step, blob);
    if (res.indexOf('ok ') === 0) step.ok(pick.title + ' page ' + pick.page + ' — TASVEER KHUL GAYI (' + res.slice(3) + ')', 'size: ' + blob.size + ' bytes, type: ' + blob.type);
    else step.bad(pick.title + ' page ' + pick.page + ' — ' + res, 'size: ' + blob.size + ' bytes, type: ' + blob.type);
  }
  async function run() {
    stepsEl.innerHTML = '';
    var sEnv = addStep('1. Browser');
    sEnv.ok('online = ' + navigator.onLine + ', display scale (dpr) = ' + (window.devicePixelRatio || 1));

    var sH = addStep('2. Health file dobara mangna (2 koshish)');
    var h1 = 'fail', h2 = 'fail';
    try { var rh = await fetch(WORKER + '/api/health'); h1 = 'HTTP ' + rh.status; } catch (e) { h1 = 'FAIL (' + e.message + ')'; }
    try { var rh2 = await fetch(WORKER + '/api/health'); h2 = 'HTTP ' + rh2.status; } catch (e) { h2 = 'FAIL (' + e.message + ')'; }
    sH.set(h1.indexOf('HTTP') === 0 && h2.indexOf('HTTP') === 0 ? 'ok' : 'bad', 'Koshish 1: ' + h1 + ' — Koshish 2: ' + h2);

    var sTok = addStep('3. Login token');
    var found = findToken();
    if (found && found.error) { sTok.bad('Token nahi mila', found.error); return; }
    if (!found) { sTok.bad('Token NAHI mila'); return; }
    sTok.ok('Token mila — role: ' + found.role + ' (length ' + found.token.length + ')');

    var taf = findPage('tafseer', 0) || firstPage();
    var sT = addStep('4. Al Tafseer page 1 — pura reader wala tareeqa (file + tasveer)');
    await fullReaderFlow(sT, taf, found.token);

    var qai = findPage('qaida', 3) || findPage('qaida', 0);
    var sQ = addStep('5. Qaida page — pura reader wala tareeqa (file + tasveer)');
    await fullReaderFlow(sQ, qai, found.token);
  }
  document.getElementById('runBtn').addEventListener('click', run);
})();
</script>
</body>
</html>
